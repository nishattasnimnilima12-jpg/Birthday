<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Happy Birthday</title>
<style>
:root{--w:min(48vw,50vh);--h:calc(var(--w)*1.4);--paper:#f7f0e1;--ink:#4a3322;--hand:"Bradley Hand","Segoe Print","Comic Sans MS","Chalkboard SE",cursive}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background-color:#c49a6c;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' seed='4'/><feColorMatrix values='0 0 0 0 .35 0 0 0 0 .22 0 0 0 0 .1 0 0 0 .45 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>"),radial-gradient(ellipse at center,#d3ab7c 0%,#b88b5c 100%);color:var(--ink);font-family:Georgia,serif;overflow:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.stage{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;padding-top:6vh}
.book{position:relative;width:calc(var(--w)*2);height:var(--h);perspective:2400px;transform:translateX(calc(var(--w)/-2));transition:transform 1.1s cubic-bezier(.6,.05,.2,1)}
.book.open{transform:none}
.page,.face{position:absolute;width:var(--w);height:var(--h);background:var(--paper);box-shadow:0 10px 24px rgba(60,35,10,.35)}
.right{left:50%;border-radius:0 6px 6px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3%;background-image:linear-gradient(90deg,rgba(0,0,0,.14),transparent 8%)}
.cover{position:absolute;left:50%;width:var(--w);height:var(--h);transform-origin:left center;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.6,.05,.2,1);cursor:pointer}
.book.open .cover{transform:rotateY(-180deg);cursor:default}
.face{backface-visibility:hidden;-webkit-backface-visibility:hidden;left:0;top:0;overflow:hidden}
.front{border-radius:0 6px 6px 0;padding:0;background:#222}
.front img{width:100%;height:100%;object-fit:cover;display:block}
.back{transform:rotateY(180deg);border-radius:6px 0 0 6px;display:flex;align-items:center;justify-content:center;background-image:linear-gradient(270deg,rgba(0,0,0,.14),transparent 8%)}
.tape{position:absolute;width:26%;height:5%;background:rgba(255,226,150,.65);box-shadow:0 1px 3px rgba(0,0,0,.2);z-index:5;pointer-events:none}
.tape.a{top:-1.5%;left:-5%;transform:rotate(-38deg)}.tape.b{top:-1.5%;right:-5%;transform:rotate(38deg)}
.hint{position:absolute;bottom:7%;left:0;right:0;text-align:center;font:italic 15px var(--hand);color:#fff;text-shadow:0 1px 4px #000;z-index:6;pointer-events:none}
.env{position:relative;width:88%;transform:rotate(-1.5deg)}
.env img{width:100%;display:block;box-shadow:0 5px 14px rgba(0,0,0,.35)}
.env button{position:absolute;left:0;top:10%;width:52%;height:82%;background:none;border:0;cursor:pointer;border-radius:8px}
.env button:focus-visible,.back-btn:focus-visible,.collage:focus-visible{outline:3px solid #c0392b}
.note{position:absolute;bottom:4%;left:0;right:0;text-align:center;font:italic 15px var(--hand)}
.letter{position:absolute;inset:4% 0 0;margin:auto;height:92%;width:fit-content;opacity:0;transform:translate(-16%,12%) scale(.5) rotate(-3deg);pointer-events:none;transition:transform .6s cubic-bezier(.3,1.2,.5,1),opacity .5s .1s;z-index:10;cursor:pointer;background:none;border:0;padding:0;filter:drop-shadow(0 10px 18px rgba(0,0,0,.45))}
.letter img{height:100%;display:block;border:6px solid #fff;border-bottom-width:14px}
.letter.up{opacity:1;transform:rotate(1.2deg);pointer-events:auto}
.scene{position:relative;width:100%}.cakeimg{width:100%;display:block;border:6px solid #fff;border-bottom-width:6px;box-shadow:0 5px 14px rgba(0,0,0,.35)}
.scene{padding:0}.flame{position:absolute;transform-origin:50% 100%;pointer-events:none;transition:opacity .35s,transform .35s;margin:6px 0 0 6px}
.flame.out{opacity:0;transform:scale(.3) translateY(-30%)!important}
.wish{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font:700 clamp(18px,3.6vw,30px) var(--hand);color:#fff;background:rgba(60,35,10,.55);opacity:0;pointer-events:none;transition:opacity .5s;padding:10px}
.wish.on{opacity:1}
.meter{width:70%;height:10px;border:2px solid var(--ink);border-radius:6px;background:#fff7e6;overflow:hidden}.meter i{display:block;height:100%;width:0;background:#7ec4a3;transition:width .08s}
.ctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{background:#fff7e6;border:2px dashed var(--ink);border-radius:4px;padding:7px 12px;font:700 14px var(--hand);color:var(--ink);cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}.btn.hold,.btn:active{background:#f4d9a8}.btn:focus-visible{outline:3px solid #c0392b}
.btn[hidden]{display:none}
.collage{background:none;border:0;padding:0;cursor:pointer;width:100%}

.collage{height:calc(100% - 44px)}.collage img{width:100%;height:100%;object-fit:contain;display:block;border:5px solid #fff;box-shadow:0 5px 14px rgba(0,0,0,.35);transform:rotate(-1deg)}
.right .sub{display:none;width:100%;height:100%}.right .sub.on{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.right .cap{font:italic 16px var(--hand);text-align:center}
.back-btn{background:#fff7e6;border:2px dashed var(--ink);border-radius:4px;padding:10px 20px;font:700 16px var(--hand);color:var(--ink);cursor:pointer;opacity:0;pointer-events:none;transform:rotate(-1deg);transition:opacity .4s .6s;box-shadow:0 3px 8px rgba(0,0,0,.25)}
.stage.is-open .back-btn{opacity:1;pointer-events:auto}
.conf{position:fixed;top:-20px;width:10px;height:14px;z-index:99;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important}.conf{display:none}}
</style></head><body>

 </div>
 <button class="back-btn" id="closeBtn">back to cover</button>
</div>
<script>
const $=id=>document.getElementById(id),book=$('book'),stage=$('stage'),letter=$('letter');
var setOpen=function(o){book.classList.toggle('open',o);stage.classList.toggle('is-open',o);
 if(!o)lift(false)};
function lift(u){letter.classList.toggle('up',u);$('note').style.opacity=u?0:1}
function showCake(c){$('cakeView').classList.toggle('on',c);$('collageView').classList.toggle('on',!c)}
function confetti(){const cs=['#e8627c','#f4b942','#7ec4a3','#6aa6e0','#fff'];
 for(let i=0;i<45;i++){const s=document.createElement('span');s.className='conf';
  s.style.cssText=`left:${Math.random()*100}vw;background:${cs[i%5]};animation-duration:${2+Math.random()*2}s;animation-delay:${Math.random()*.5}s`;
  document.body.appendChild(s);setTimeout(()=>s.remove(),5000)}}
$('cover').addEventListener('click',()=>{if(!book.classList.contains('open'))setOpen(true)});
$('cover').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();if(!book.classList.contains('open'))setOpen(true)}});
$('closeBtn').onclick=()=>setOpen(false);
$('envBtn').onclick=()=>lift(true);
letter.onclick=()=>lift(false);
const flames=[...document.querySelectorAll('.flame')],fill=$('meterFill'),cap=$('cap');
let fq,ctx,an,buf,micOn=false,holding=false,blow=0,out=false,last=0,lvl=0,raf=0,wishT;
function tick(t){raf=requestAnimationFrame(tick);const dt=Math.min((t-last)/1000||0,.05);last=t;
 let raw=0,noisy=true;if(an){an.getFloatTimeDomainData(buf);let s=0;for(const v of buf)s+=v*v;raw=Math.min(1,Math.sqrt(s/buf.length)*6);
  an.getFloatFrequencyData(fq);let ls=0,ar=0;const N=120;for(let k=2;k<N;k++){const p=Math.pow(10,fq[k]/10)+1e-12;ls+=Math.log(p);ar+=p}
  noisy=Math.exp(ls/(N-2))/(ar/(N-2))>.12} // blowing is flat noise; speech and tones have sharp peaks
 const target=holding?.9:raw;lvl+=(target-lvl)*.35;fill.style.width=Math.round(lvl*100)+'%';
 const blowing=holding||(lvl>.3&&noisy);
 if(!out){blow=blowing?blow+dt:Math.max(0,blow-dt*1.5);
  flames.forEach((f,i)=>{const bend=Math.min(lvl,1)*40,fl=Math.sin(t/90+i*2)*(2+lvl*6);
   f.style.transform=`rotate(${bend+fl}deg) scaleY(${1-lvl*.25})`});
  if(blow>=.5)snuff()}}
function snuff(){out=true;flames.forEach((f,i)=>setTimeout(()=>f.classList.add('out'),i*90));
 $('relight').hidden=false;cap.textContent='all out!';
 setTimeout(()=>{$('wish').classList.add('on');confetti()},500);
 wishT=setTimeout(()=>{$('wish').classList.remove('on');showCake(false)},4200)}
function relight(){clearTimeout(wishT);out=false;blow=0;$('wish').classList.remove('on');
 flames.forEach(f=>{f.classList.remove('out');f.style.transform=''});
 $('relight').hidden=true;cap.textContent='blow into your mic to blow out the candles';showCake(true)}
function start(){if(!raf)raf=requestAnimationFrame(tick)}
function stop(){cancelAnimationFrame(raf);raf=0}
$('micBtn').onclick=async()=>{
 if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)||!window.isSecureContext){cap.textContent='mic needs https (host the file). use hold to blow or the spacebar';return}
 try{const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  ctx=new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();const src=ctx.createMediaStreamSource(st);
  an=ctx.createAnalyser();an.fftSize=1024;buf=new Float32Array(an.fftSize);fq=new Float32Array(an.frequencyBinCount);src.connect(an);micOn=true;
  $('micBtn').hidden=true;cap.textContent='mic is on. blow!'}
 catch(e){cap.textContent='mic blocked. use hold to blow or the spacebar'}};
const hb=$('holdBtn'),hold=v=>{holding=v;hb.classList.toggle('hold',v)};
hb.addEventListener('pointerdown',e=>{e.preventDefault();hold(true)});
['pointerup','pointerleave','pointercancel'].forEach(n=>hb.addEventListener(n,()=>hold(false)));
document.addEventListener('keydown',e=>{if(e.code==='Space'&&book.classList.contains('open')&&$('cakeView').classList.contains('on')){e.preventDefault();hold(true)}});
document.addEventListener('keyup',e=>{if(e.code==='Space')hold(false)});
$('relight').onclick=relight;$('relight2').onclick=relight;
const _so=setOpen;setOpen=function(o){_so(o);if(o)start();else{relight();stop()}};
</script></body></html>
